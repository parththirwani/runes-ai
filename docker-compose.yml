services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runes
      POSTGRES_PASSWORD: runes
      POSTGRES_DB: runes-ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runes -d runes-ai"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Legacy warm engine container. The worker no longer needs it because it runs
  # Tectonic directly inside its own isolated image. It stays for deployments that
  # pin TECTONIC_ENGINE=docker-exec while rolling back.
  tectonic:
    image: dxjoke/tectonic-docker:latest
    container_name: runes-ai-tectonic
    restart: unless-stopped
    entrypoint: ["tail", "-f", "/dev/null"]
    working_dir: /workspace
    volumes:
      - latex-temp:/workspace/temp
      - compile-tmp:/workspace/compile
    healthcheck:
      test: ["CMD", "tectonic", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      WORKER_PORT: 3001
      TECTONIC_ENGINE: direct
      WORKER_CONCURRENCY: "2"
      COMPILE_TIMEOUT_MS: "90000"
      COMPILE_TMP_DIR: /tmp/runes-compile
      ASSET_STORAGE_DIR: /data/assets
    ports:
      - "3001:3001"
    volumes:
      - compile-tmp:/tmp/runes-compile
      - asset-data:/data
      - tectonic-cache:/home/node/.cache
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  latex-temp:
  compile-tmp:
  asset-data:
  tectonic-cache:
