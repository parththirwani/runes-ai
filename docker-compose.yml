services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runes
      POSTGRES_PASSWORD: runes
      POSTGRES_DB: runes-ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runes -d runes-ai"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /workspace
    # Pandoc and Tectonic run in a private network namespace. The worker
    # fails Markdown compiles if the namespace cannot be created.
    cap_add:
      - SYS_ADMIN
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      WORKER_PORT: 3001
      PANDOC_BIN: /usr/local/bin/pandoc
      PDF_ENGINE_BIN: /usr/local/bin/tectonic
      TECTONIC_BINARY: /usr/local/bin/tectonic
      TECTONIC_ENGINE: direct
      ASSET_STORAGE_DIR: /app/.data/assets
      COMPILER_REQUIRE_NETNS: "1"
    ports:
      - "3001:3001"
    volumes:
      - latex-temp:/workspace/temp
      - ./.data/assets:/app/.data/assets
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  latex-temp:
